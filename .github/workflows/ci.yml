name: Source validation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test,torch]'
      - run: python -m pytest -m 'not integration'
      - run: python -m biotoxbridge.experiments.runner config/experiments/liver_loael_unified.yaml --dry-run
      - run: python -m biotoxbridge.experiments.runner config/experiments/aeid252_unified.yaml --dry-run
